[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "disclosure-eval"
version = "0.1.0"
description = "Test AI customer service agents for confirmation-based PII disclosure."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "NXT AI LLC", email = "research@nxt-ai.net" }]
keywords = [
    "llm",
    "security",
    "evaluation",
    "pii",
    "red-team",
    "customer-service",
    "ai-safety",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.scripts]
disclosure-eval = "disclosure_eval.cli:main"

[project.urls]
Homepage = "https://nxt-ai.net"
Repository = "https://github.com/nxtaillc/disclosure-eval"
Research = "https://nxt-ai.net/research/absent-deliberation"

[tool.hatch.build.targets.wheel]
packages = ["disclosure_eval"]

[tool.hatch.build.targets.sdist]
include = [
    "disclosure_eval/",
    "tests/",
    "examples/",
    "README.md",
    "LICENSE",
    "CITATION.cff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]
